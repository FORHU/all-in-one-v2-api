name: Deploy Staging

on:
  workflow_run:
    workflows: ['CI']
    branches: [staging]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to deploy'
        required: true
        default: staging

concurrency:
  group: all-in-one-api-deploy-staging
  cancel-in-progress: true

env:
  ECR_REPOSITORY: all-in-one-v2-api-staging
  AWS_REGION: ap-southeast-1
  NODE_ENV: staging
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
  EC2_IAM_ROLE_NAME: all-in-one-api-staging-role
  CONTAINER_NAME: all-in-one-v2-api
  APP_PORT: 3002

jobs:
  deploy:
    name: Build, Push & Deploy (staging)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Grant EC2 role ECR pull access
        run: |
          aws iam put-role-policy \
            --role-name "${{ env.EC2_IAM_ROLE_NAME }}" \
            --policy-name all-in-one-api-ecr-pull \
            --policy-document file://infra/ec2-ecr-pull-policy.json || echo "Warning: Could not attach inline policy."

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          ECR="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          docker build -t "$ECR:${{ env.IMAGE_TAG }}" -t "$ECR:latest" .
          docker push "$ECR:${{ env.IMAGE_TAG }}"
          docker push "$ECR:latest"

      - name: Write env file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_EXPIRY: ${{ secrets.JWT_EXPIRY || '15m' }}
          ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN || 'localhost' }}
          DEFAULT_TENANT_SLUG: ${{ secrets.DEFAULT_TENANT_SLUG || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
          CHAT_WONDER_API_URL: ${{ secrets.CHAT_WONDER_API_URL || '' }}
          MAILER_TRANSPORT_HOST: ${{ secrets.MAILER_TRANSPORT_HOST || 'smtp.ethereal.email' }}
          MAILER_TRANSPORT_PORT: ${{ secrets.MAILER_TRANSPORT_PORT || '587' }}
          MAILER_TRANSPORT_SECURE: ${{ secrets.MAILER_TRANSPORT_SECURE || 'false' }}
          MAILER_EMAIL: ${{ secrets.MAILER_EMAIL || '' }}
          MAILER_PASSWORD: ${{ secrets.MAILER_PASSWORD || '' }}
          REDIS_HOST: ${{ secrets.REDIS_HOST || 'localhost' }}
          REDIS_PORT: ${{ secrets.REDIS_PORT || '6379' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || '' }}
          REDIS_TTL_SECONDS: ${{ secrets.REDIS_TTL_SECONDS || '3600' }}
          REDIS_TLS: ${{ secrets.REDIS_TLS || 'false' }}
          WORKER_HEALTH_PORT: ${{ secrets.WORKER_HEALTH_PORT || '8080' }}
          METRICS_INTERVAL_MS: ${{ secrets.METRICS_INTERVAL_MS || '60000' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || env.AWS_REGION }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          S3_CDN_URL: ${{ secrets.S3_CDN_URL || '' }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL || 'amqp://guest:guest@localhost:5672/' }}
          RABBITMQ_EXCHANGE: ${{ secrets.RABBITMQ_EXCHANGE || 'app_events_exchange' }}
          RABBITMQ_QUEUE_PREFIX: ${{ secrets.RABBITMQ_QUEUE_PREFIX || 'app' }}
          INGESTION_QUEUE_NAME: ${{ secrets.INGESTION_QUEUE_NAME || 'ingestion_jobs' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || '' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || '' }}
          GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID || '' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || '' }}
          WEBSUB_CALLBACK_URL: ${{ secrets.WEBSUB_CALLBACK_URL || '' }}
          WEBSUB_SECRET: ${{ secrets.WEBSUB_SECRET || '' }}
          CJ_BASE_URL: ${{ secrets.CJ_BASE_URL || 'https://developers.cjdropshipping.com/api2.0/v1' }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY || '' }}
          CJ_RATE_LIMIT_MS: ${{ secrets.CJ_RATE_LIMIT_MS || '1500' }}
          CJ_SUPPLIER_CACHE_TTL: ${{ secrets.CJ_SUPPLIER_CACHE_TTL || '3600' }}
          PRINTFUL_BASE_URL: ${{ secrets.PRINTFUL_BASE_URL || 'https://api.printful.com' }}
          PRINTFUL_API_KEY: ${{ secrets.PRINTFUL_API_KEY || '' }}
          PRINTFUL_STORE_ID: ${{ secrets.PRINTFUL_STORE_ID || '' }}
          PRINTFUL_RATE_LIMIT_MS: ${{ secrets.PRINTFUL_RATE_LIMIT_MS || '500' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || '' }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY || '' }}
        run: |
          cat > ${{ github.workspace }}/api.env << EOF
          PORT=${{ env.APP_PORT }}
          NODE_ENV=${{ env.NODE_ENV }}
          DATABASE_URL=${DATABASE_URL}
          JWT_SECRET=${JWT_SECRET}
          JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
          JWT_EXPIRY=${JWT_EXPIRY}
          ROOT_DOMAIN=${ROOT_DOMAIN}
          DEFAULT_TENANT_SLUG=${DEFAULT_TENANT_SLUG}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          CHAT_WONDER_API_URL=${CHAT_WONDER_API_URL}
          MAILER_TRANSPORT_HOST=${MAILER_TRANSPORT_HOST}
          MAILER_TRANSPORT_PORT=${MAILER_TRANSPORT_PORT}
          MAILER_TRANSPORT_SECURE=${MAILER_TRANSPORT_SECURE}
          MAILER_EMAIL=${MAILER_EMAIL}
          MAILER_PASSWORD=${MAILER_PASSWORD}
          REDIS_HOST=${REDIS_HOST}
          REDIS_PORT=${REDIS_PORT}
          REDIS_PASSWORD=${REDIS_PASSWORD}
          REDIS_TTL_SECONDS=${REDIS_TTL_SECONDS}
          REDIS_TLS=${REDIS_TLS}
          WORKER_HEALTH_PORT=${WORKER_HEALTH_PORT}
          METRICS_INTERVAL_MS=${METRICS_INTERVAL_MS}
          AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
          AWS_REGION=${AWS_REGION}
          AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
          S3_CDN_URL=${S3_CDN_URL}
          RABBITMQ_URL=${RABBITMQ_URL}
          RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE}
          RABBITMQ_QUEUE_PREFIX=${RABBITMQ_QUEUE_PREFIX}
          INGESTION_QUEUE_NAME=${INGESTION_QUEUE_NAME}
          YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_ANDROID_CLIENT_ID=${GOOGLE_ANDROID_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          WEBSUB_CALLBACK_URL=${WEBSUB_CALLBACK_URL}
          WEBSUB_SECRET=${WEBSUB_SECRET}
          CJ_BASE_URL=${CJ_BASE_URL}
          CJ_API_KEY=${CJ_API_KEY}
          CJ_RATE_LIMIT_MS=${CJ_RATE_LIMIT_MS}
          CJ_SUPPLIER_CACHE_TTL=${CJ_SUPPLIER_CACHE_TTL}
          PRINTFUL_BASE_URL=${PRINTFUL_BASE_URL}
          PRINTFUL_API_KEY=${PRINTFUL_API_KEY}
          PRINTFUL_STORE_ID=${PRINTFUL_STORE_ID}
          PRINTFUL_RATE_LIMIT_MS=${PRINTFUL_RATE_LIMIT_MS}
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
          STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
          EOF

      - name: Copy env file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: api.env
          target: /home/ec2-user/

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            chmod 600 /home/ec2-user/api.env
            set -a
            source /home/ec2-user/api.env
            set +a
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

            # Run migrations before swapping the container.
            docker run --rm \
              --entrypoint npx \
              --network all-in-one \
              --env-file /home/ec2-user/api.env \
              ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
              prisma migrate deploy

            # Stop and restart API container
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm   ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker run -d --name ${{ env.CONTAINER_NAME }} --restart unless-stopped \
              --network all-in-one \
              --env-file /home/ec2-user/api.env \
              -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

            # Stop and restart Worker container
            docker stop ${{ env.CONTAINER_NAME }}-worker 2>/dev/null || true
            docker rm   ${{ env.CONTAINER_NAME }}-worker 2>/dev/null || true
            docker run -d --name ${{ env.CONTAINER_NAME }}-worker --restart unless-stopped \
              --network all-in-one \
              --env-file /home/ec2-user/api.env \
              -p 127.0.0.1:8080:8080 \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
              npm run worker

            # Health check loop for API container
            echo "Verifying API container health..."
            HEALTH_CHECK_PASSED=false
            for i in {1..10}; do
              if curl -sf http://127.0.0.1:${{ env.APP_PORT }}/api/health/live > /dev/null 2>&1; then
                echo "Health check passed!"
                HEALTH_CHECK_PASSED=true
                break
              fi
              echo "Waiting for API to become ready... (attempt $i/10)"
              sleep 3
            done

            if [ "$HEALTH_CHECK_PASSED" = false ]; then
              echo "Health check failed after 30 seconds. Displaying container logs:"
              docker logs ${{ env.CONTAINER_NAME }} --tail 50
              exit 1
            fi

            docker image prune -f
