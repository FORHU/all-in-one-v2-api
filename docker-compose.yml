services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data

  redis-insight:
    image: redis/redisinsight:latest
    restart: always
    ports:
      - '${REDIS_INSIGHT_PORT:-5540}:5540'
    volumes:
      - redis-insight_data:/data
    depends_on:
      - redis

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Local S3-compatible storage for image uploads, via SeaweedFS's S3 gateway.
  # Point the API at it with S3_ENDPOINT=http://localhost:9000 (see .env.example).
  # Gated behind a profile, same reasoning as the `app` service's own
  # `containerized-api` profile below: a bare `docker compose up` shouldn't
  # pull this unless it's actually wanted.
  #
  # This used to run the real minio/minio + minio/mc images. Both were pulled
  # from Docker Hub, and their quay.io mirror stopped serving anonymous pulls
  # too, around September 2026 — MinIO's project now only ships source, not
  # containers (see github.com/minio/minio). Swapped in SeaweedFS's S3 gateway
  # as a drop-in replacement: verified by hand (CreateBucket, PutObject,
  # PutBucketPolicy, and an anonymous unauthenticated GET against the
  # policy-public object all worked against this exact image/command). Auth
  # is a static file instead of MinIO's env-var login — see
  # seaweedfs-s3-config.json (same minioadmin/minioadmin dev credentials as
  # before). Bucket creation + the public-read policy that used to be
  # minio-init's job now happens lazily in s3.util.ts on first upload instead
  # of a separate init container, since there's no MinIO-`mc`-equivalent CLI
  # image to run it in anymore — see ensureLocalBucketReady there.
  minio:
    image: chrislusf/seaweedfs:latest
    profiles: [minio]
    restart: always
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports:
      - '${MINIO_PORT:-9000}:8333'
    volumes:
      - minio_data:/data
      - ./seaweedfs-s3-config.json:/etc/seaweedfs/s3.json:ro

  app:
    build: .
    # Not "always" like the other services here — this container competes
    # with `npm run dev` for the same host port, and "always" meant Docker
    # kept silently bringing it back (e.g. after Docker Desktop/WSL2
    # restarts) even after being manually stopped, each time serving a
    # different local DB than whatever DATABASE_URL was actually configured
    # for local dev. Start it explicitly (`docker compose up app`) when you
    # actually want the containerized API instead of the local dev server.
    restart: 'no'
    # `restart: 'no'` alone isn't enough — it only stops Docker's own
    # crash-recovery from reviving this container, not a bare
    # `docker compose up`/`up -d` (run to bring up db/redis/rabbitmq for
    # `npm run dev`), which starts every service in this file by default,
    # `app` included, and has repeatedly shadowed the local dev server on
    # the same port. A profile makes that opt-in instead of the default: a
    # plain `docker compose up` now skips `app` entirely; run
    # `docker compose --profile containerized-api up -d app` when you
    # actually want the containerized API.
    profiles:
      - containerized-api
    ports:
      - '${PORT:-3002}:${PORT:-3002}'
    env_file:
      - .env
    # Override the localhost-based URLs from .env so the container reaches
    # the other services by their compose service names instead of itself.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
    depends_on:
      - db
      - redis
      - rabbitmq

volumes:
  postgres_data:
  redis_data:
  redis-insight_data:
  rabbitmq_data:
  minio_data:
